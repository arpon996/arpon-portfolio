<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arpon Admin</title>
  <link rel="stylesheet" href="admin.css">
<style>
  /* পুরো পেজকে সেন্টারে আনার জন্য */
  body {
    background-color: #0f0f0f;
    color: #fff;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* জাদুকরী কোড: যেটা X বাটনওয়ালা বক্স এবং অন্যান্য লুকানো জিনিসকে জোর করে লুকিয়ে রাখবে */
  [hidden] {
    display: none !important;
  }

  /* অ্যাডমিন ড্যাশবোর্ডের মেইন কন্টেইনার */
  .container, main, #app {
    width: 100%;
    max-width: 800px;
    margin: 40px auto;
  }

  /* লগইন বক্সকে একদম স্ক্রিনের মাঝে আনার জন্য */
  #loginDiv {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh; /* স্ক্রিনের মাঝখানে ভাসিয়ে রাখবে */
  }

  /* লগইন বক্সের প্রফেশনাল ডিজাইন */
  #loginDiv .box {
    width: 100%;
    max-width: 400px;
    background: #1a1a1a;
    padding: 40px;
    border-radius: 12px;
    border: 1px solid #333;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
  }

  #loginDiv .box input {
    width: 85%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: white;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  #loginDiv .box button {
    background-color: #c6f03a;
    color: #000;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    width: 92%;
    margin-top: 10px;
    transition: background 0.3s;
  }

  #loginDiv .box button:hover {
    background-color: #aadb25;
  }
</style>
</head>
<body>
  
  <div id="loginDiv">
    <div class="box">
      <b>ARPON CHAKLADER........<span>.</span></b>
      <h1>Admin Panel</h1>
      <p>Manage projects and updates.</p>
      <input id="email" placeholder="Email">
      <input id="pass" type="password" placeholder="Password">
      <button onclick="login(event)">LOGIN</button>
      <small>Powered by Firebase</small>
      <br><br>
      <a href="index.html">← Website</a>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <b>ARPON<span>.</span></b>
      <button onclick="logout()">Logout</button>
    </header>
    <main>
      <h1>Manage your site.</h1>
      <div class="tabs">
        <button onclick="tab('projects')">Projects</button>
        <button onclick="tab('posts')">Posts</button>
      </div>
      <section id="projects">
        <div class="bar">
          <h2>Projects</h2>
          <button onclick="projectForm()">+ Add Project</button>
        </div>
        <div id="plist"></div>
      </section>
      <section id="posts" hidden>
        <div class="bar">
          <h2>Posts</h2>
          <button onclick="postForm()">+ Add Post</button>
        </div>
        <div id="olist"></div>
      </section>
    </main>
  </div>

  <div id="modal" hidden>
    <div class="modalbox">
      <button class="close" onclick="closeModal()">×</button>
      <div id="form"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
