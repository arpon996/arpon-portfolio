<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arpon Admin</title>
  <link rel="stylesheet" href="admin.css">
  <style>
  /* Puro page k center e anar jonno */
  body {
    background-color: #0f0f0f;
    color: #fff;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Admin dashboard er main container center korar jadu */
  .container, main, #admin-panel, .wrapper {
    width: 100%;
    max-width: 800px; /* Beshi choriye jabe na */
    margin: 40px auto; /* Upor-niche space ar dane-bame ekdom center */
  }

  /* Login form er design */
  #login-section {
    width: 100%;
    max-width: 400px;
    margin: 100px auto;
    background: #1a1a1a;
    padding: 30px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    text-align: center;
  }

  #login-section input {
    width: 90%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    border: 1px solid #444;
    background: #222;
    color: white;
  }

  #login-section button {
    background-color: #c6f03a;
    color: #000;
    font-weight: bold;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 95%;
  }
</style>
</head>
<body>
  
  <div id="loginDiv">
    <div class="box">
      <b>ARPON CHAKLADER........<span>.</span></b>
      <h1>Admin Panel</h1>
      <p>Manage projects and updates.</p>
      <input id="email" placeholder="Email">
      <input id="pass" type="password" placeholder="Password">
      <button onclick="login(event)">LOGIN</button>
      <small>Powered by Firebase</small>
      <br><br>
      <a href="index.html">← Website</a>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <b>ARPON<span>.</span></b>
      <button onclick="logout()">Logout</button>
    </header>
    <main>
      <h1>Manage your site.</h1>
      <div class="tabs">
        <button onclick="tab('projects')">Projects</button>
        <button onclick="tab('posts')">Posts</button>
      </div>
      <section id="projects">
        <div class="bar">
          <h2>Projects</h2>
          <button onclick="projectForm()">+ Add Project</button>
        </div>
        <div id="plist"></div>
      </section>
      <section id="posts" hidden>
        <div class="bar">
          <h2>Posts</h2>
          <button onclick="postForm()">+ Add Post</button>
        </div>
        <div id="olist"></div>
      </section>
    </main>
  </div>

  <div id="modal" hidden>
    <div class="modalbox">
      <button class="close" onclick="closeModal()">×</button>
      <div id="form"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
