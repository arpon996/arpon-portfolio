<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arpon Admin</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    /* Ei choto code ta kalo box take jor kore lukiye rakhbe jotoqkhon na apni 'Add Project' e click koren */
    #modal[hidden] { display: none !important; }
  </style>
</head>
<body>
  
  <div id="loginDiv">
    <div class="box">
      <b>ARPON CHAKLADER........<span>.</span></b>
      <h1>Admin Panel</h1>
      <p>Manage projects and updates.</p>
      <input id="email" placeholder="Email">
      <input id="pass" type="password" placeholder="Password">
      <button onclick="login(event)">LOGIN</button>
      <small>Powered by Firebase</small>
      <br><br>
      <a href="index.html">← Website</a>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <b>ARPON<span>.</span></b>
      <button onclick="logout()">Logout</button>
    </header>
    <main>
      <h1>Manage your site.</h1>
      <div class="tabs">
        <button onclick="tab('projects')">Projects</button>
        <button onclick="tab('posts')">Posts</button>
      </div>
      <section id="projects">
        <div class="bar">
          <h2>Projects</h2>
          <button onclick="projectForm()">+ Add Project</button>
        </div>
        <div id="plist"></div>
      </section>
      <section id="posts" hidden>
        <div class="bar">
          <h2>Posts</h2>
          <button onclick="postForm()">+ Add Post</button>
        </div>
        <div id="olist"></div>
      </section>
    </main>
  </div>

  <div id="modal" hidden>
    <div class="modalbox">
      <button class="close" onclick="closeModal()">×</button>
      <div id="form"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
